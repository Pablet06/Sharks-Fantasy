name: Weekly Stats Sync

on:
  schedule:
    - cron: '0 22 * * 6'  # Every Saturday at 22:00 UTC (00:00 CEST)
    # Reintento: si el sábado el acta aún no estaba publicada o Cloudflare
    # bloqueó (429), el incremental solo procesa jornadas sin historial, así
    # que repetirlo es seguro.
    - cron: '0 22 * * 0'  # Every Sunday at 22:00 UTC
    # Diario: la federación publica la fecha de un partido cuando quiere, y la
    # jornada (draft, apuestas, presupuesto) no existe hasta que el scraper la ve.
    # El incremental es idempotente (solo escribe lo nuevo), así que repetirlo es seguro.
    - cron: '0 8 * * *'   # Every day at 08:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      args:
        description: 'Extra scraper flags (empty = incremental), e.g. --anterior 1324114'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        run: npm ci
        working-directory: scraper

      - name: Run stats sync (incremental)
        # No .env file here — env vars injected below. dotenv no-ops on missing file.
        # SCRAPER_ARGS goes through env (never interpolated into the script) and is
        # expanded unquoted on purpose so it splits into flags; no eval, so shell
        # metacharacters in it are inert text.
        run: npm run sync:prod -- $SCRAPER_ARGS
        working-directory: scraper
        env:
          SCRAPER_ARGS: ${{ inputs.args }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notify on failure
        if: failure()
        run: echo "::error::Scraper sync failed! Check logs above."
