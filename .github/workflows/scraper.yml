name: Weekly Stats Sync

on:
  schedule:
    # Weekend runs are meant for 21:00 Spanish time, but GitHub crons are UTC only:
    # 20:00 UTC is 21:00 in winter (CET) and 22:00 in summer (CEST). Move both to
    # 19:00 UTC when the clocks go forward (end of March) and back in October.
    - cron: '0 20 * * 6'  # Every Saturday at 20:00 UTC (21:00 CET)
    # Reintento: si el sábado el acta aún no estaba publicada o Cloudflare
    # bloqueó (429), el incremental solo procesa jornadas sin historial, así
    # que repetirlo es seguro.
    - cron: '0 20 * * 0'  # Every Sunday at 20:00 UTC (21:00 CET)
    # Diario: la federación publica la fecha de un partido cuando quiere, y la
    # jornada (draft, apuestas, presupuesto) no existe hasta que el scraper la ve.
    # El incremental es idempotente (solo escribe lo nuevo), así que repetirlo es seguro.
    - cron: '0 8 * * *'   # Every day at 08:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub UI
    inputs:
      args:
        description: 'Extra scraper flags (empty = incremental), e.g. --anterior 1324114'
        required: false
        default: ''

jobs:
  sync:
    # Self-hosted runner at home: the federation (Cloudflare) answers HTTP 429 to
    # GitHub's IPs on /match/<id>/stats, but not to the home IP. Only safe because
    # this workflow runs on schedule and workflow_dispatch alone: never add push or
    # pull_request triggers here (the repo is public). The custom label keeps other
    # jobs from landing on this runner by accident.
    runs-on: [self-hosted, sharks-scraper]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        run: npm ci
        working-directory: scraper

      - name: Run stats sync (incremental)
        # No .env file here — env vars injected below. dotenv no-ops on missing file.
        # SCRAPER_ARGS goes through env (never interpolated into the script) and is
        # expanded unquoted on purpose so it splits into flags; no eval, so shell
        # metacharacters in it are inert text.
        run: npm run sync:prod -- $SCRAPER_ARGS
        working-directory: scraper
        env:
          SCRAPER_ARGS: ${{ inputs.args }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Notify on failure
        if: failure()
        run: echo "::error::Scraper sync failed! Check logs above."
